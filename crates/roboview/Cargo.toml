[package]
name = "roboview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui-wgpu = "0.32.3"
# Sole use: constructing the glam::Vec2 argument of OrbitCamera::pan
# (roboview-core does not re-export glam). Same exact version as the core
# crate, so both resolve to the single glam instance in the workspace lock.
glam = "0.33.6"
rfd = "0.17.2"
roboview-core = { path = "../roboview-core", version = "0.1.0" }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
